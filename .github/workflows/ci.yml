name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_MODE: development
      DEV_SESSION_SECRET: ledgerharbour-ci-only-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: corepack pnpm audit --audit-level high

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm exec tsc --noEmit

      - name: Unit and integration tests
        run: corepack pnpm test

      - name: Build
        run: corepack pnpm build

      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: corepack pnpm test:e2e
