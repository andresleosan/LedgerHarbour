name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI uses deterministic test adapters and is never a production environment.
      NODE_ENV: test
      AUTH_MODE: firebase
      OCR_PROVIDER: fake
      PERSISTENCE_MODE: memory
      STORAGE_MODE: local
      RATE_LIMIT_MODE: memory
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-public-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:1234567890:web:ciapp
      NEXT_PUBLIC_FIREBASE_TEST_ADAPTER: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Pin pnpm
        run: corepack install --global pnpm@11.21.0

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: corepack pnpm audit --audit-level high

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm exec tsc --noEmit

      - name: Unit and integration tests
        run: corepack pnpm test

      - name: Build
        run: corepack pnpm build

      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: corepack pnpm test:e2e
